x-customizable-image: &customizable_image
  # By default the image used only contains the `frappe` and `erpnext` apps.
  # See https://github.com/frappe/frappe_docker/blob/main/docs/02-setup/02-build-setup.md#define-custom-apps
  # about using custom images.
  image: ${CUSTOM_IMAGE:-frappe/erpnext}:${CUSTOM_TAG:-$ERPNEXT_VERSION}
  # RundiNova runs a locally built, controlled release image by default.
  # Set PULL_POLICY explicitly when an operator intends to pull an image.
  pull_policy: ${PULL_POLICY:-never}
  restart: ${RESTART_POLICY:-unless-stopped}

x-depends-on-configurator: &depends_on_configurator
  depends_on:
    configurator:
      condition: service_completed_successfully

x-backend-defaults: &backend_defaults
  <<: [*depends_on_configurator, *customizable_image]
  volumes:
    - sites:/home/frappe/frappe-bench/sites

x-rundinova-github-environment: &rundinova_github_environment
  RUNDINOVA_GITHUB_TOKEN: ${RUNDINOVA_GITHUB_TOKEN:-}
  RUNDINOVA_GITHUB_APP_ID: ${RUNDINOVA_GITHUB_APP_ID:-}
  RUNDINOVA_GITHUB_INSTALLATION_ID: ${RUNDINOVA_GITHUB_INSTALLATION_ID:-}
  RUNDINOVA_GITHUB_INSTALLATIONS_JSON: ${RUNDINOVA_GITHUB_INSTALLATIONS_JSON:-}
  RUNDINOVA_GITHUB_APP_PRIVATE_KEY_B64: ${RUNDINOVA_GITHUB_APP_PRIVATE_KEY_B64:-}
  RUNDINOVA_GEMINI_API_KEY: ${RUNDINOVA_GEMINI_API_KEY:-}
  RUNDINOVA_GEMINI_MODEL: ${RUNDINOVA_GEMINI_MODEL:-gemini-2.5-flash}
  RUNDINOVA_AI_PROVIDER: ${RUNDINOVA_AI_PROVIDER:-gemini}
  COHERE_API_KEY: ${COHERE_API_KEY:-}
  COHERE_MODEL: ${COHERE_MODEL:-command-r7b-12-2024}

services:
  configurator:
    <<: *backend_defaults
    platform: linux/amd64
    entrypoint:
      - bash
      - -c
    # add redis_socketio for backward compatibility
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        bench set-config -g chromium_path /usr/bin/chromium-headless-shell;
    environment:
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-}
      REDIS_CACHE: ${REDIS_CACHE:-}
      REDIS_QUEUE: ${REDIS_QUEUE:-}
      SOCKETIO_PORT: 9000
    depends_on: {}
    restart: on-failure

  backend:
    <<: *backend_defaults
    platform: linux/amd64
    healthcheck:
      test:
        - CMD
        - /home/frappe/frappe-bench/env/bin/python
        - -c
        - "import pathlib, socket, urllib.request; sites=pathlib.Path('/home/frappe/frappe-bench/sites'); site=next((p.name for p in sites.iterdir() if p.is_dir() and (p/'site_config.json').exists()), None); socket.create_connection(('127.0.0.1',8000),timeout=3).close() if site is None else urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/method/ping', headers={'Host': site}), timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    environment:
      <<: *rundinova_github_environment
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      RUNDINOVA_GITHUB_TOKEN: ${RUNDINOVA_GITHUB_TOKEN:-}

  frontend:
    <<: *customizable_image
    platform: linux/amd64
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      NGINX_LISTEN_PORT: ${NGINX_LISTEN_PORT:-8080}
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME_HEADER:-$$host}
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS:-127.0.0.1}
      UPSTREAM_REAL_IP_HEADER: ${UPSTREAM_REAL_IP_HEADER:-X-Forwarded-For}
      UPSTREAM_REAL_IP_RECURSIVE: ${UPSTREAM_REAL_IP_RECURSIVE:-off}
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-120}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-50m}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      backend:
        condition: service_healthy
      websocket:
        condition: service_started

  websocket:
    <<: [*depends_on_configurator, *customizable_image]
    platform: linux/amd64
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - sites:/home/frappe/frappe-bench/sites

  queue-short:
    <<: *backend_defaults
    platform: linux/amd64
    command: bench worker --queue short,default
    environment: *rundinova_github_environment

  queue-long:
    <<: *backend_defaults
    platform: linux/amd64
    command: bench worker --queue long,default,short
    environment: *rundinova_github_environment

  scheduler:
    <<: *backend_defaults
    platform: linux/amd64
    command: bench schedule
    environment: *rundinova_github_environment

# ERPNext requires local assets access (Frappe does not)
volumes:
  sites:
